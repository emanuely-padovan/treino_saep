
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema - Serviços</title>
</head>
<body>

    <h1>Serviços</h1>

    <p><a href="/principal">Voltar</a></p>

    <!-- ===================================
         LISTAGEM
         EDITE: colunas e campos
    ==================================== -->

    <table border="1">
        <tr>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Preço</th>
            <th>Duração</th>
            <th>Ações</th>
        </tr>

        {{#servicos}}
        <tr>
            <td>{{nome}}</td>
            <td>{{descricao}}</td>
            <td>{{preco}}</td>
            <td>{{duracao}}</td>

            <td>
                <a href="/servicos?editar={{id}}">Editar</a>

                <form method="POST" action="/servicos/{{id}}">
                    <input
                        type="hidden"
                        name="_method"
                        value="DELETE"
                    />
                    <button>Excluir</button>
                </form>
            </td>
        </tr>
        {{/servicos}}
    </table>

    <!-- ===================================
         CADASTRO / EDIÇÃO
         MANTER: estrutura Mustache
    ==================================== -->

    <h2>
        {{#editando}}Editar{{/editando}}
        {{^editando}}Cadastrar{{/editando}}
        serviço
    </h2>

    <form method="POST" action="{{acao}}">

        {{#editando}}
        <input
            type="hidden"
            name="_method"
            value="PUT"
        />
        {{/editando}}

        <!-- EDITE: campos da entidade -->

        <input
            type="text"
            name="nome"
            placeholder="Nome do serviço"
            value="{{form.nome}}"
            required
        />

        <input
            type="text"
            name="descricao"
            placeholder="Descrição"
            value="{{form.descricao}}"
        />

        <input
            type="number"
            step="0.01"
            name="preco"
            placeholder="Preço"
            value="{{form.preco}}"
            required
        />

        <input
            type="number"
            name="duracao"
            placeholder="Duração em minutos"
            value="{{form.duracao}}"
        />

        <button>
            {{#editando}}Salvar{{/editando}}
            {{^editando}}Cadastrar{{/editando}}
        </button>

    </form>

    <p>{{erro}}</p>

</body>
</html>

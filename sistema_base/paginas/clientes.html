
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema - Clientes</title>
</head>
<body>

    <h1>Clientes</h1>

    <p><a href="/principal">Voltar</a></p>

    <!-- ===================================
         PESQUISA
         EDITE: campo utilizado na busca
    ==================================== -->

    <form method="GET" action="/clientes">
        <input
            type="text"
            name="busca"
            placeholder="Buscar por nome..."
            value="{{busca}}"
        />
        <button>Buscar</button>
    </form>

    <!-- ===================================
         LISTAGEM
         EDITE: colunas e campos da entidade
    ==================================== -->

    <table border="1">
        <tr>
            <th>Nome</th>
            <th>CPF</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th>Ações</th>
        </tr>

        {{#clientes}}
        <tr>
            <td>{{nome}}</td>
            <td>{{cpf}}</td>
            <td>{{telefone}}</td>
            <td>{{email}}</td>

            <td>
                <a href="/clientes?editar={{id}}">Editar</a>

                <form method="POST" action="/clientes/{{id}}">
                    <input
                        type="hidden"
                        name="_method"
                        value="DELETE"
                    />
                    <button>Excluir</button>
                </form>
            </td>
        </tr>
        {{/clientes}}
    </table>

    <!-- ===================================
         CADASTRO / EDIÇÃO
         MANTER: estrutura Mustache
    ==================================== -->

    <h2>
        {{#editando}}Editar{{/editando}}
        {{^editando}}Cadastrar{{/editando}}
        cliente
    </h2>

    <form method="POST" action="{{acao}}">

        {{#editando}}
        <input
            type="hidden"
            name="_method"
            value="PUT"
        />
        {{/editando}}

        <!-- EDITE: campos da entidade -->

        <input
            type="text"
            name="nome"
            placeholder="Nome"
            value="{{form.nome}}"
            required
        />

        <input
            type="text"
            name="cpf"
            placeholder="CPF"
            value="{{form.cpf}}"
            required
        />

        <input
            type="text"
            name="telefone"
            placeholder="Telefone"
            value="{{form.telefone}}"
        />

        <input
            type="email"
            name="email"
            placeholder="E-mail"
            value="{{form.email}}"
        />

        <button>
            {{#editando}}Salvar{{/editando}}
            {{^editando}}Cadastrar{{/editando}}
        </button>

    </form>

    <p>{{erro}}</p>

</body>
</html>
